# LIBERO Goal VQ-BeT, single-GPU embedding-precompute run.
defaults:
  - train_libero_goal
  - override /encoder: dino_patch
  - override /cluster: local
  - _self_

batch_size: 32
epochs: 50
eval_freq: 10
eval_on_env_freq: 1
precompute_embeddings: true
num_workers: 0
window_size: 2
goal_window_size: 2
eval_window_size: 2
