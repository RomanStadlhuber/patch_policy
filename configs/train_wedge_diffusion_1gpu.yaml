# Wedge diffusion policy, single-GPU embedding-precompute run: 300 epochs, 100 rollouts per env
# eval, as the constant-LR baseline (supermanipulation STATUS.md, "Baseline run").
defaults:
  - train_wedge_diffusion
  - override /encoder: dino_patch
  - override /cluster: local
  - _self_

batch_size: 256
epochs: 300
eval_freq: 1
# env eval every 10 epochs ((epoch + 1) % freq == 0), then the final eval
eval_on_env_freq: 10
num_envs: 10
num_env_evals: 100
num_final_evals: 100
precompute_embeddings: true
num_workers: 2

# cached embeddings in fp16: halves the host-RAM cache the precompute builds
embedding_fp16: true
embedding_cache: file
train_fraction: 0.9
