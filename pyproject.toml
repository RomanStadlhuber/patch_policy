[project.optional-dependencies]
blockpush = [
    "pybullet==3.2.7",
    "six==1.16.0",
]
libero = [
    "robosuite==1.4.1",
    "bddl==1.0.1",
    "mujoco==3.2.7",
    "easydict==1.9",
    "future==0.18.2",  # bddl imports it without declaring it
    "h5py==3.11.0",
]
